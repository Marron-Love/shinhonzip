<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>버스 정류장별 잔여좌석</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #151923;
      --muted: #626b7a;
      --line: #d9dee8;
      --accent: #1769aa;
      --bad: #a51d2d;
      --good: #116329;
      --warn: #a35b00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    header, main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
    }

    header { padding: 28px 0 18px; }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(110px, .7fr) minmax(110px, .7fr) minmax(150px, 1fr) minmax(170px, 1.1fr) minmax(170px, 1.1fr);
      gap: 12px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 8px 10px;
    }

    .travel-panel {
      display: grid;
      grid-template-columns: minmax(130px, auto) 1fr minmax(130px, auto) 1fr;
      gap: 8px 18px;
      align-items: center;
      margin: 16px 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
    }

    .travel-panel span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .travel-panel strong {
      display: block;
      font-size: 34px;
      line-height: 1.1;
    }

    .travel-panel p {
      margin: 0;
      color: var(--muted);
      line-height: 1.45;
    }

    .table-wrap {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 840px;
      border-collapse: collapse;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #eef2f7;
      color: #3c4655;
      font-size: 13px;
    }

    tr:last-child td { border-bottom: 0; }
    .empty {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }

    .muted { color: var(--muted); }
    .seats-good { color: var(--good); font-weight: 700; }
    .seats-zero { color: var(--bad); font-weight: 700; }
    .warning { color: var(--warn); }
    .stack {
      display: grid;
      gap: 3px;
    }
    .day-group {
      display: grid;
      gap: 3px;
      padding-top: 5px;
      border-top: 1px solid var(--line);
    }
    .day-group:first-child {
      padding-top: 0;
      border-top: 0;
    }
    .bus-chip {
      display: inline-block;
      min-width: 46px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--chip-bg);
      color: var(--chip-fg);
      font-weight: 700;
      text-align: center;
    }

    @media (max-width: 820px) {
      .filters, .travel-panel { grid-template-columns: 1fr; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>정류장별 잔여좌석</h1>
    <div class="status" id="status">데이터를 불러오는 중입니다.</div>
  </header>

  <main>
    <section class="filters" aria-label="조회 조건">
      <label>
        노선
        <select id="routeId"><option value="">노선을 선택</option></select>
      </label>
      <label>
        목적
        <select id="commuteMode">
          <option value="morning">출근</option>
          <option value="evening">퇴근</option>
        </select>
      </label>
      <label>
        탑승 시간대
        <select id="timeSlot"><option value="">시간대를 선택</option></select>
      </label>
      <label>
        출발 정류장
        <select id="fromStation"><option value="">노선 선택</option></select>
      </label>
      <label>
        도착 정류장
        <select id="toStation"><option value="">노선 선택</option></select>
      </label>
    </section>

    <section class="travel-panel" aria-label="소요시간">
      <span>평균 소요시간</span>
      <strong id="travelAvg">-</strong>
      <span>출발 평균 좌석</span>
      <strong id="fromSeatAvg">-</strong>
      <span>계산 기준</span>
      <p id="travelDetail">정류장 두 개를 선택하면 같은 차량 기준 소요시간을 계산합니다.</p>
    </section>

    <section class="table-wrap" aria-label="정류장별 잔여좌석">
      <table>
        <thead>
          <tr>
            <th>순번</th>
            <th>정류장</th>
            <th>정류장 ID</th>
            <th>잔여좌석</th>
            <th>차량</th>
            <th>관측시각</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td class="empty" colspan="6">노선과 탑승 시간대를 선택하세요.</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const apiBaseUrl = "https://api.statistics.bus.skystar.kr";
    const state = { index: null, catalog: [], route: [], routeCache: new Map(), locations: new Map() };
    const dashboardRouteIds = new Set(["204000057", "228000429", "228000431"]);
    // ponytail: dashboard-only 3330 picker limits; move to route data if this grows.
    const route3330Limits = { id: "204000057", eveningFromSeq: 21, morningToSeq: 66 };
    // ponytail: API requires a date range; old enough start date means "all accumulated" for this dashboard.
    const locationsFromDate = "2020-01-01";

    const slots = {
      morning: slotRange(7 * 60, 11 * 60),
      evening: slotRange(16 * 60, 21 * 60)
    };

    function slotRange(start, end) {
      const values = [];
      for (let minute = start; minute < end; minute += 30) values.push(minute);
      return values;
    }

    function hhmm(minute) {
      return `${String(Math.floor(minute / 60)).padStart(2, "0")}:${String(minute % 60).padStart(2, "0")}`;
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      return new Date(String(value).replace(" ", "T").replace(/(\.\d{3})\d+/, "$1"));
    }

    function kstParts(date) {
      return Object.fromEntries(new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(date).map((part) => [part.type, part.value]));
    }

    function dateKey(value) {
      const parsed = parseDate(value);
      const textDate = String(value || "").match(/^\d{4}-\d{2}-\d{2}/)?.[0];
      if (!parsed || Number.isNaN(parsed.getTime())) return textDate || "";
      const parts = kstParts(parsed);
      return `${parts.year}-${parts.month}-${parts.day}`;
    }

    function fmtTime(value) {
      const date = parseDate(value);
      return date && !Number.isNaN(date.getTime())
        ? date.toLocaleTimeString("ko-KR", { timeZone: "Asia/Seoul", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false })
        : "-";
    }

    function rowMinute(row) {
      const date = parseDate(row.retrieved_at);
      const parts = kstParts(date);
      return Number(parts.hour) * 60 + Number(parts.minute);
    }

    function setStatus(message, isWarning = false) {
      $("status").textContent = message;
      $("status").className = isWarning ? "status warning" : "status";
    }

    async function getJson(path, fallback) {
      try {
        const res = await fetch(path, { cache: "no-store" });
        return res.ok ? await res.json() : fallback;
      } catch {
        return fallback;
      }
    }

    async function getApiJson(path, params = {}) {
      const url = new URL(path, apiBaseUrl);
      for (const [key, value] of Object.entries(params)) url.searchParams.set(key, value);
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
      return res.json();
    }

    function arrayFrom(payload) {
      return Array.isArray(payload)
        ? payload
        : payload?.data || payload?.items || payload?.rows || payload?.response?.msgBody?.busRouteStationList || payload?.response?.body?.items || [];
    }

    function normalizeLocation(row, routeId) {
      return {
        route_id: String(row.route_id ?? row.routeId ?? row.bus_id ?? row.busId ?? routeId ?? ""),
        station_id: String(row.station_id ?? row.stationId ?? ""),
        station_seq: Number(row.station_seq ?? row.stationSeq ?? row.seq ?? 0),
        plate_no: String(row.plate_no ?? row.plateNo ?? row.vehicle_no ?? row.vehicleNo ?? ""),
        retrieved_at: row.retrieved_at ?? row.retrievedAt ?? row.timestamp ?? row.at ?? new Date().toISOString(),
        remain_seat_num: Number(row.remain_seat_num ?? row.remainSeatNum ?? row.remaining_seats ?? row.remainingSeats ?? row.remainSeatCnt ?? 0),
        eta_minutes: row.eta_minutes ?? row.etaMinutes ?? row.duration_minutes ?? row.durationMinutes ?? null
      };
    }

    function normalizeStation(row) {
      return {
        station_seq: Number(row.station_seq ?? row.stationSeq ?? row.stationSeqNo ?? row.seq ?? row.seqNo ?? 0),
        station_id: String(row.station_id ?? row.stationId ?? row.stationID ?? ""),
        station_name: String(row.station_name ?? row.stationName ?? row.stationNameKr ?? row.name ?? row.stationNm ?? ""),
        turn_seq: Number(row.turn_seq ?? row.turnSeq ?? 0) || null
      };
    }

    async function loadIndex() {
      const index = await getJson("data/index.json", { updated_at: null, dates: [], routes: [] });
      state.catalog = await getJson("data/route_catalog.json", []);
      const routes = [...dashboardRouteIds];
      state.index = { ...index, updated_at: new Date().toISOString(), routes };

      $("routeId").innerHTML = '<option value="">노선을 선택</option>' + routeOptions();
      renderSlots();

      setStatus(state.index.updated_at ? `마지막 갱신: ${new Date(state.index.updated_at).toLocaleString("ko-KR", { hour12: false })}` : "아직 수집된 데이터가 없습니다.", !state.index.updated_at);

      if (state.index.mock && state.index.routes?.length) {
        $("routeId").value = state.index.routes[0];
        $("commuteMode").value = "morning";
        renderSlots();
        $("timeSlot").value = "420";
        await updateStationPickers();
        await search();
      }
    }

    function renderSlots() {
      const mode = $("commuteMode").value || "morning";
      $("timeSlot").innerHTML = slots[mode].map((start) => `<option value="${start}">${hhmm(start)}-${hhmm(start + 30)}</option>`).join("");
    }

    function latestDate() {
      return state.index?.dates?.at(-1) || "";
    }

    function routeOptions() {
      const catalogById = new Map(state.catalog.map((route) => [String(route.route_id), route]));
      return (state.index.routes || []).map((id) => {
        const route = catalogById.get(String(id));
        const label = route?.route_no || String(id);
        return `<option value="${id}">${label}</option>`;
      }).join("");
    }

    function selectedRouteMeta() {
      const routeId = $("routeId").value;
      return state.catalog.find((route) => String(route.route_id) === String(routeId)) || {};
    }

    async function loadRoute(routeId) {
      if (!routeId) return [];
      if (state.routeCache.has(routeId)) {
        state.route = state.routeCache.get(routeId);
        return state.route;
      }
      // ponytail: station_seq only becomes useful after this static bus/route station lookup.
      const fallback = () => getJson(`data/routes/${encodeURIComponent(routeId)}.json`, []);
      const raw = await getApiJson(`/api/busRouteStations/${encodeURIComponent(routeId)}`).catch(fallback);
      const stations = arrayFrom(raw).map(normalizeStation).filter((station) => station.station_seq && station.station_name);
      const meta = state.catalog.find((route) => String(route.route_id) === String(routeId)) || {};
      const turnSeq = stations.find((station) => String(station.station_id) === String(meta.end_station_id))?.station_seq
        || stations.find((station) => Number(station.turn_seq))?.turn_seq
        || null;
      state.route = stations.map((station) => ({ ...station, turn_seq: turnSeq || station.turn_seq }))
        .sort((a, b) => Number(a.station_seq) - Number(b.station_seq));
      state.routeCache.set(routeId, state.route);
      return state.route;
    }

    function routeTurnSeq(stations) {
      return stations.find((station) => Number(station.turn_seq))?.turn_seq || Math.max(...stations.map((station) => Number(station.station_seq)));
    }

    function commuteStations(stations) {
      const turnSeq = routeTurnSeq(stations);
      const mode = $("commuteMode").value;
      const reverse = Boolean(selectedRouteMeta().reverse_commute);
      const useAfterTurn = reverse ? mode === "morning" : mode === "evening";
      return useAfterTurn
        ? stations.filter((station) => Number(station.station_seq) >= turnSeq)
        : stations.filter((station) => Number(station.station_seq) <= turnSeq);
    }

    function pickerStations(stations, picker) {
      const routeId = $("routeId").value;
      const mode = $("commuteMode").value;
      if (routeId !== route3330Limits.id) return stations;
      if (mode === "evening" && picker === "from") {
        return stations.filter((station) => Number(station.station_seq) >= route3330Limits.eveningFromSeq);
      }
      if (mode === "morning" && picker === "to") {
        return stations.filter((station) => Number(station.station_seq) <= route3330Limits.morningToSeq);
      }
      return stations;
    }

    function tableStations(stations) {
      const fromSeq = Number($("fromStation").value);
      const toSeq = Number($("toStation").value);
      if (!fromSeq || !toSeq) return stations;
      const [startSeq, endSeq] = [Math.min(fromSeq, toSeq), Math.max(fromSeq, toSeq)];
      const visible = stations.filter((station) => {
        const seq = Number(station.station_seq);
        return seq >= startSeq && seq <= endSeq;
      });
      return fromSeq > toSeq ? visible.reverse() : visible;
    }

    async function updateStationPickers() {
      const routeId = $("routeId").value;
      const stations = routeId ? commuteStations(await loadRoute(routeId)) : [];
      const fromStations = pickerStations(stations, "from");
      const toStations = pickerStations(stations, "to");
      const options = (items) => items.map((station) => `<option value="${station.station_seq}">${station.station_name || "-"}</option>`).join("");
      $("fromStation").innerHTML = options(fromStations) || '<option value="">정류장 없음</option>';
      $("toStation").innerHTML = options(toStations) || '<option value="">정류장 없음</option>';
      if (fromStations.length) $("fromStation").value = fromStations[0].station_seq;
      if (toStations.length) {
        $("toStation").value = toStations.at(-1).station_seq;
      }
    }

    async function loadLocations(routeId) {
      const key = routeId;
      if (!state.locations.has(key)) {
        const fallback = async () => (await getJson("data/locations/all.json", []))
          .filter((row) => String(row.route_id) === routeId);
        const raw = await getApiJson(`/api/busLocations/${encodeURIComponent(routeId)}`, {
          from: locationsFromDate,
          to: dateKey(new Date())
        }).catch(fallback);
        state.locations.set(key, arrayFrom(raw)
          .map((row) => normalizeLocation(row, routeId))
          .filter((row) => row.route_id && row.station_seq && row.retrieved_at));
      }
      return state.locations.get(key);
    }

    function observationsByStation(rows) {
      const grouped = new Map();
      for (const row of rows) {
        const key = Number(row.station_seq);
        grouped.set(key, [...(grouped.get(key) || []), row]);
      }
      for (const [key, values] of grouped) {
        const earliestByBusAndDate = new Map();
        for (const row of values) {
          const dedupeKey = [dateKey(row.retrieved_at), row.plate_no || ""].join("|");
          const prev = earliestByBusAndDate.get(dedupeKey);
          if (!prev || parseDate(row.retrieved_at) < parseDate(prev.retrieved_at)) {
            earliestByBusAndDate.set(dedupeKey, row);
          }
        }
        grouped.set(key, [...earliestByBusAndDate.values()].sort((a, b) => parseDate(a.retrieved_at) - parseDate(b.retrieved_at)));
      }
      return grouped;
    }

    function busSuffix(plate) {
      return String(plate || "-").match(/\d{4}$/)?.[0] || String(plate || "-").slice(-4);
    }

    function busColor(plate) {
      const colors = [
        ["#e8f1ff", "#174a8b"],
        ["#eaf7ec", "#17622f"],
        ["#fff1db", "#8a4b00"],
        ["#f4eefe", "#5b2a86"],
        ["#e8f7f8", "#0f5b63"],
        ["#fdecef", "#8b1d32"]
      ];
      const key = String(plate || "");
      const sum = [...key].reduce((total, char) => total + char.charCodeAt(0), 0);
      return colors[sum % colors.length];
    }

    function chip(plate, value) {
      const [bg, fg] = busColor(plate);
      return `<span class="bus-chip" style="--chip-bg:${bg};--chip-fg:${fg}">${value}</span>`;
    }

    function byDate(rows, renderItem) {
      const grouped = new Map();
      for (const row of rows) {
        const key = dateKey(row.retrieved_at);
        grouped.set(key, [...(grouped.get(key) || []), row]);
      }
      return `<span class="stack">${[...grouped.entries()].map(([, items]) =>
        `<span class="day-group">${items.map((item) => `<span>${renderItem(item)}</span>`).join("")}</span>`
      ).join("")}</span>`;
    }

    function render(stations, grouped) {
      if (!stations.length) {
        $("rows").innerHTML = '<tr><td class="empty" colspan="6">이 노선의 정류장 목록이 없습니다.</td></tr>';
        return;
      }

      $("rows").innerHTML = stations.map((station) => {
        const rows = grouped.get(Number(station.station_seq)) || [];
        const hasSeats = rows.some((row) => Number(row.remain_seat_num) > 0);
        return `<tr>
          <td>${station.station_seq}</td>
          <td>${station.station_name || "-"}</td>
          <td class="muted">${station.station_id || "-"}</td>
          <td class="${rows.length ? (hasSeats ? "seats-good" : "seats-zero") : "muted"}">${rows.length ? byDate(rows, (row) => chip(row.plate_no, Number(row.remain_seat_num ?? 0))) : "관측 없음"}</td>
          <td>${rows.length ? byDate(rows, (row) => chip(row.plate_no, busSuffix(row.plate_no))) : "-"}</td>
          <td>${rows.length ? byDate(rows, (row) => chip(row.plate_no, fmtTime(row.retrieved_at))) : "-"}</td>
        </tr>`;
      }).join("");
    }

    function renderTravelTime(rows, startMinute) {
      const fromSeq = Number($("fromStation").value);
      const toSeq = Number($("toStation").value);
      const fromName = state.route.find((station) => Number(station.station_seq) === fromSeq)?.station_name || "출발 정류장";
      const toName = state.route.find((station) => Number(station.station_seq) === toSeq)?.station_name || "도착 정류장";
      const fromRows = rows.filter((row) => Number(row.station_seq) === fromSeq)
        .filter((row) => rowMinute(row) >= startMinute && rowMinute(row) < startMinute + 30);
      const seatSamples = new Map();
      for (const row of fromRows) {
        const key = [dateKey(row.retrieved_at), row.plate_no || ""].join("|");
        const prev = seatSamples.get(key);
        if (!prev || parseDate(row.retrieved_at) < parseDate(prev.retrieved_at)) seatSamples.set(key, row);
      }
      const seatRows = [...seatSamples.values()];
      const fromSeats = seatRows.map((row) => Number(row.remain_seat_num ?? 0));
      $("fromSeatAvg").textContent = fromSeats.length
        ? `${Math.round(fromSeats.reduce((sum, seat) => sum + seat, 0) / fromSeats.length)}석`
        : "-";
      const seatDayCount = new Set(seatRows.map((row) => dateKey(row.retrieved_at))).size;

      if (!fromSeq || !toSeq || fromSeq === toSeq) {
        $("travelAvg").textContent = "-";
        $("travelDetail").textContent = "서로 다른 정류장 두 개를 선택하세요.";
        return;
      }

      const byPlate = new Map();
      for (const row of rows) {
        if (!row.plate_no) continue;
        const key = [dateKey(row.retrieved_at), row.plate_no].join("|");
        byPlate.set(key, [...(byPlate.get(key) || []), row]);
      }

      const matches = [];
      for (const [key, plateRows] of byPlate) {
        const plate = key.split("|").at(-1);
        const allFromRows = plateRows
          .filter((row) => Number(row.station_seq) === fromSeq)
          .sort((a, b) => parseDate(a.retrieved_at) - parseDate(b.retrieved_at));
        const fromRows = allFromRows
          .filter((row) => rowMinute(row) >= startMinute && rowMinute(row) < startMinute + 30);
        const toRows = plateRows
          .filter((row) => Number(row.station_seq) === toSeq)
          .sort((a, b) => parseDate(a.retrieved_at) - parseDate(b.retrieved_at));

        for (const from of fromRows) {
          const fromAt = parseDate(from.retrieved_at);
          const nextFromAt = allFromRows
            .map((row) => parseDate(row.retrieved_at))
            .find((at) => at > fromAt);
          const to = toRows.find((row) => {
            const toAt = parseDate(row.retrieved_at);
            return toAt > fromAt && (!nextFromAt || toAt < nextFromAt);
          });
          if (!to) continue;
          const minutes = (parseDate(to.retrieved_at) - fromAt) / 60000;
          if (minutes > 0) matches.push({ plate, minutes, fromAt, toAt: parseDate(to.retrieved_at) });
          break;
        }
      }

      if (!matches.length) {
        $("travelAvg").textContent = "-";
        $("travelDetail").textContent = `${fromName} -> ${toName}: 소요 평균 없음, 좌석 ${seatDayCount}일 / ${seatRows.length}대 평균`;
        return;
      }

      const avg = matches.reduce((sum, item) => sum + item.minutes, 0) / matches.length;
      const dayCount = new Set(matches.map((item) => dateKey(item.fromAt))).size;
      $("travelAvg").textContent = `${Math.round(avg)}분`;
      $("travelDetail").textContent = `${fromName} -> ${toName}: 소요 ${dayCount}일 / ${matches.length}대 평균, 좌석 ${seatDayCount}일 / ${seatRows.length}대 평균`;
    }

    async function search() {
      const routeId = $("routeId").value;
      const start = Number($("timeSlot").value);
      const end = start + 30;

      if (!routeId || Number.isNaN(start)) {
        setStatus("노선과 탑승 시간대를 선택하세요.", true);
        return;
      }

      setStatus("조회 중입니다.");

      const stations = commuteStations(await loadRoute(routeId));
      const visibleStations = tableStations(stations);
      const visibleStationSeqs = new Set(visibleStations.map((station) => Number(station.station_seq)));
      const allRows = (await loadLocations(routeId))
        .filter((row) => String(row.route_id) === routeId)
        .filter((row) => stations.some((station) => Number(station.station_seq) === Number(row.station_seq)));
      const rows = allRows
        .filter((row) => visibleStationSeqs.has(Number(row.station_seq)))
        .filter((row) => {
          const minute = rowMinute(row);
          return minute >= start && minute < end;
        });

      render(visibleStations, observationsByStation(rows));
      renderTravelTime(allRows, start);
      setStatus(`${hhmm(start)}-${hhmm(end)} 누적 ${rows.length}건 관측`);
    }

    $("routeId").addEventListener("change", async () => {
      await updateStationPickers();
      search();
    });
    $("commuteMode").addEventListener("change", async () => {
      renderSlots();
      await updateStationPickers();
      search();
    });
    $("timeSlot").addEventListener("change", () => search());
    $("fromStation").addEventListener("change", () => search());
    $("toStation").addEventListener("change", () => search());
    loadIndex();
  </script>
</body>
</html>
