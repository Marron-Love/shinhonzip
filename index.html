<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>버스 정류장별 잔여좌석</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #151923;
      --muted: #626b7a;
      --line: #d9dee8;
      --accent: #1769aa;
      --bad: #a51d2d;
      --good: #116329;
      --warn: #a35b00;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
    }

    header, main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
    }

    header { padding: 28px 0 18px; }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
    }

    .status {
      color: var(--muted);
      font-size: 14px;
    }

    .filters {
      display: grid;
      grid-template-columns: minmax(280px, 2fr) minmax(180px, 1fr) 120px;
      gap: 12px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    label {
      display: grid;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    select, button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      padding: 8px 10px;
    }

    button {
      align-self: end;
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin: 16px 0;
    }

    .metric {
      padding: 14px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .metric strong {
      display: block;
      margin-top: 4px;
      font-size: 22px;
    }

    .table-wrap {
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      min-width: 840px;
      border-collapse: collapse;
    }

    th, td {
      padding: 11px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #eef2f7;
      color: #3c4655;
      font-size: 13px;
    }

    tr:last-child td { border-bottom: 0; }
    .empty {
      padding: 32px 16px;
      color: var(--muted);
      text-align: center;
    }

    .muted { color: var(--muted); }
    .seats-good { color: var(--good); font-weight: 700; }
    .seats-zero { color: var(--bad); font-weight: 700; }
    .warning { color: var(--warn); }

    @media (max-width: 820px) {
      .filters, .summary { grid-template-columns: 1fr; }
      h1 { font-size: 23px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>정류장별 잔여좌석</h1>
    <div class="status" id="status">데이터를 불러오는 중입니다.</div>
  </header>

  <main>
    <section class="filters" aria-label="조회 조건">
      <label>
        노선
        <select id="routeId"><option value="">노선을 선택</option></select>
      </label>
      <label>
        탑승 시간대
        <select id="timeSlot"><option value="">시간대를 선택</option></select>
      </label>
      <button id="search" type="button">조회</button>
    </section>

    <section class="summary" aria-label="요약">
      <div class="metric">전체 정류장<strong id="stationCount">0</strong></div>
      <div class="metric">관측 정류장<strong id="observedCount">0</strong></div>
      <div class="metric">좌석 있음<strong id="availableCount">0</strong></div>
      <div class="metric">데이터 날짜<strong id="dataDate">-</strong></div>
    </section>

    <section class="table-wrap" aria-label="정류장별 잔여좌석">
      <table>
        <thead>
          <tr>
            <th>순번</th>
            <th>정류장</th>
            <th>정류장 ID</th>
            <th>잔여좌석</th>
            <th>차량</th>
            <th>관측시각</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td class="empty" colspan="6">노선과 탑승 시간대를 선택하세요.</td></tr>
        </tbody>
      </table>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const state = { index: null, catalog: [], route: [], locations: new Map() };

    const slots = [
      ...slotRange(6 * 60, 11 * 60),
      ...slotRange(16 * 60, 21 * 60)
    ];

    function slotRange(start, end) {
      const values = [];
      for (let minute = start; minute < end; minute += 30) values.push(minute);
      return values;
    }

    function hhmm(minute) {
      return `${String(Math.floor(minute / 60)).padStart(2, "0")}:${String(minute % 60).padStart(2, "0")}`;
    }

    function parseDate(value) {
      if (!value) return null;
      if (value instanceof Date) return value;
      return new Date(String(value).replace(" ", "T").replace(/(\.\d{3})\d+/, "$1"));
    }

    function dateKey(value) {
      const textDate = String(value || "").match(/^\d{4}-\d{2}-\d{2}/)?.[0];
      const parsed = parseDate(value);
      return textDate || (parsed && !Number.isNaN(parsed.getTime()) ? parsed.toISOString().slice(0, 10) : "");
    }

    function fmtTime(value) {
      const date = parseDate(value);
      return date && !Number.isNaN(date.getTime())
        ? date.toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false })
        : "-";
    }

    function rowMinute(row) {
      const date = parseDate(row.retrieved_at);
      return date.getHours() * 60 + date.getMinutes();
    }

    function setStatus(message, isWarning = false) {
      $("status").textContent = message;
      $("status").className = isWarning ? "status warning" : "status";
    }

    async function getJson(path, fallback) {
      try {
        const res = await fetch(path, { cache: "no-store" });
        return res.ok ? await res.json() : fallback;
      } catch {
        return fallback;
      }
    }

    async function loadIndex() {
      state.index = await getJson("data/index.json", { updated_at: null, dates: [], routes: [] });
      state.catalog = await getJson("data/route_catalog.json", []);

      $("routeId").innerHTML = '<option value="">노선을 선택</option>' + routeOptions();
      $("timeSlot").innerHTML = slots.map((start) => `<option value="${start}">${hhmm(start)}-${hhmm(start + 30)}</option>`).join("");
      $("dataDate").textContent = latestDate() || "-";

      setStatus(state.index.updated_at ? `마지막 갱신: ${new Date(state.index.updated_at).toLocaleString("ko-KR", { hour12: false })}` : "아직 수집된 데이터가 없습니다.", !state.index.updated_at);

      if (state.index.mock && state.index.routes?.length) {
        $("routeId").value = state.index.routes[0];
        $("timeSlot").value = "420";
        await search();
      }
    }

    function latestDate() {
      return state.index?.dates?.at(-1) || "";
    }

    function routeOptions() {
      const catalogById = new Map(state.catalog.map((route) => [String(route.route_id), route]));
      return (state.index.routes || []).map((id) => {
        const label = catalogById.get(String(id))?.label || String(id);
        return `<option value="${id}">${label}</option>`;
      }).join("");
    }

    async function loadRoute(routeId) {
      if (!routeId) return [];
      // ponytail: station_seq only becomes useful after this static bus/route station lookup.
      state.route = (await getJson(`data/routes/${encodeURIComponent(routeId)}.json`, []))
        .sort((a, b) => Number(a.station_seq) - Number(b.station_seq));
      return state.route;
    }

    async function loadLocations(date) {
      if (!state.locations.has(date)) {
        state.locations.set(date, await getJson(`data/locations/${date}.json`, []));
      }
      return state.locations.get(date);
    }

    function observationsByStation(rows) {
      const grouped = new Map();
      for (const row of rows) {
        const key = Number(row.station_seq);
        grouped.set(key, [...(grouped.get(key) || []), row]);
      }
      for (const [key, values] of grouped) {
        grouped.set(key, values.sort((a, b) => parseDate(b.retrieved_at) - parseDate(a.retrieved_at)));
      }
      return grouped;
    }

    function render(stations, grouped) {
      $("stationCount").textContent = stations.length;
      $("observedCount").textContent = grouped.size;
      $("availableCount").textContent = [...grouped.values()].filter((rows) => rows.some((row) => Number(row.remain_seat_num) > 0)).length;

      if (!stations.length) {
        $("rows").innerHTML = '<tr><td class="empty" colspan="6">이 노선의 정류장 목록이 없습니다.</td></tr>';
        return;
      }

      $("rows").innerHTML = stations.map((station) => {
        const rows = grouped.get(Number(station.station_seq)) || [];
        const seats = rows.map((row) => Number(row.remain_seat_num ?? 0));
        const plates = rows.map((row) => row.plate_no || "-");
        const times = rows.map((row) => fmtTime(row.retrieved_at));
        const hasSeats = seats.some((seat) => seat > 0);
        return `<tr>
          <td>${station.station_seq}</td>
          <td>${station.station_name || "-"}</td>
          <td class="muted">${station.station_id || "-"}</td>
          <td class="${rows.length ? (hasSeats ? "seats-good" : "seats-zero") : "muted"}">${rows.length ? seats.join(" / ") : "관측 없음"}</td>
          <td>${rows.length ? plates.join(" / ") : "-"}</td>
          <td>${rows.length ? times.join(" / ") : "-"}</td>
        </tr>`;
      }).join("");
    }

    async function search() {
      const routeId = $("routeId").value;
      const date = latestDate();
      const start = Number($("timeSlot").value);
      const end = start + 30;

      if (!routeId || !date || Number.isNaN(start)) {
        setStatus("노선과 탑승 시간대를 선택하세요.", true);
        return;
      }

      $("search").disabled = true;
      setStatus("조회 중입니다.");

      const stations = await loadRoute(routeId);
      const rows = (await loadLocations(date))
        .filter((row) => String(row.route_id) === routeId)
        .filter((row) => dateKey(row.retrieved_at) === date)
        .filter((row) => {
          const minute = rowMinute(row);
          return minute >= start && minute < end;
        });

      render(stations, observationsByStation(rows));
      setStatus(`${date} ${hhmm(start)}-${hhmm(end)} 기준 ${rows.length}건 관측`);
      $("search").disabled = false;
    }

    $("search").addEventListener("click", search);
    $("routeId").addEventListener("change", () => search());
    $("timeSlot").addEventListener("change", () => search());
    loadIndex();
  </script>
</body>
</html>
